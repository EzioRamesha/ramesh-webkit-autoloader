<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024">
  <defs>
    <style>
      .chassis{fill:url(#chassisGrad);}
      .glass{fill:url(#glassGrad);opacity:.92;}
      .crack{fill:none;stroke:url(#seamGrad);stroke-width:14;stroke-linecap:round;stroke-linejoin:round;}
      .crackFine{fill:none;stroke:#9AF7FF;stroke-width:4;stroke-linecap:round;opacity:.55;}
      .core{fill:url(#coreGrad);}
      .ring{fill:none;stroke:#5EE7FF;stroke-width:6;opacity:.35;}
      .shard{fill:#B8F4FF;opacity:.22;}
    </style>
    <radialGradient id="chassisGrad" cx="38%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#1A2740"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#05080F"/>
    </radialGradient>
    <linearGradient id="glassGrad" x1="220" y1="180" x2="820" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EC8E8" stop-opacity=".55"/>
      <stop offset="35%" stop-color="#2A4A68" stop-opacity=".35"/>
      <stop offset="70%" stop-color="#142033" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#5EE7FF" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="seamGrad" x1="280" y1="200" x2="760" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8FFFF"/>
      <stop offset="45%" stop-color="#5EE7FF"/>
      <stop offset="100%" stop-color="#3D8CFF"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#5EE7FF"/>
      <stop offset="100%" stop-color="#1B6BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="disc">
      <circle cx="512" cy="512" r="500"/>
    </clipPath>
  </defs>

  <!-- Outer chassis disc -->
  <circle class="chassis" cx="512" cy="512" r="500"/>

  <!-- Bezel ring -->
  <circle cx="512" cy="512" r="478" fill="none" stroke="#3D4F66" stroke-width="18"/>
  <circle cx="512" cy="512" r="468" fill="none" stroke="#5EE7FF" stroke-width="2" opacity=".25"/>

  <g clip-path="url(#disc)">
    <!-- Membrane / glass pane -->
    <rect class="glass" x="168" y="168" width="688" height="688" rx="48"/>

    <!-- Specular highlight on glass -->
    <path fill="#DDF9FF" opacity=".12"
          d="M210 210h420c40 0 72 32 72 72v80L290 780c-50-20-90-70-100-130V250c0-22 18-40 40-40z"/>

    <!-- Fracture shards -->
    <polygon class="shard" points="520,300 610,420 540,440"/>
    <polygon class="shard" points="480,560 560,640 470,690"/>
    <polygon class="shard" points="360,400 430,470 350,500"/>

    <!-- Primary membrane breach seam (browser → kernel) -->
    <g filter="url(#softGlow)">
      <path class="crack" d="M300 220 L460 400 L420 480 L580 620 L520 700 L700 820"/>
      <path class="crackFine" d="M340 260 L470 390"/>
      <path class="crackFine" d="M450 460 L530 540"/>
      <path class="crackFine" d="M560 640 L640 720"/>
      <path class="crackFine" d="M400 430 L360 520"/>
      <path class="crackFine" d="M540 500 L620 470"/>
    </g>

    <!-- Kernel bloom at breach epicenter -->
    <circle class="core" cx="470" cy="470" r="92" filter="url(#softGlow)"/>
    <circle cx="470" cy="470" r="18" fill="#F5FFFF"/>

    <!-- Scanning orbit ticks (futuristic, not PS clone rings) -->
    <circle class="ring" cx="512" cy="512" r="390" stroke-dasharray="28 42"/>
    <circle class="ring" cx="512" cy="512" r="330" stroke-dasharray="8 28" opacity=".5"
            transform="rotate(25 512 512)"/>

    <!-- Corner fiducials -->
    <path fill="none" stroke="#5EE7FF" stroke-width="5" opacity=".55"
          d="M220 280 V230 H270 M804 280 V230 H754 M220 744 V794 H270 M804 744 V794 H754"/>
  </g>
</svg>
