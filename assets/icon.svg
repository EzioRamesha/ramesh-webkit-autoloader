<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="plateGrad" cx="42%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#162338"/>
      <stop offset="60%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#05080F"/>
    </radialGradient>
    <linearGradient id="hexGrad" x1="200" y1="180" x2="820" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9AF7FF"/>
      <stop offset="50%" stop-color="#5EE7FF"/>
      <stop offset="100%" stop-color="#3D8CFF"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="300" y1="280" x2="720" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EE7FF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#5EE7FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3D8CFF" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <circle cx="512" cy="512" r="500" fill="url(#plateGrad)"/>
  <circle cx="512" cy="512" r="478" fill="none" stroke="#3D4F66" stroke-width="16"/>

  <!-- Outer hex iris -->
  <polygon fill="none" stroke="url(#hexGrad)" stroke-width="22" stroke-linejoin="round"
           points="512,148 780,302 780,610 512,764 244,610 244,302"/>

  <!-- Iris blades -->
  <polygon fill="url(#bladeGrad)" points="512,248 690,352 512,512"/>
  <polygon fill="url(#bladeGrad)" points="690,352 690,560 512,512"/>
  <polygon fill="url(#bladeGrad)" points="690,560 512,664 512,512"/>
  <polygon fill="url(#bladeGrad)" points="512,664 334,560 512,512"/>
  <polygon fill="url(#bladeGrad)" points="334,560 334,352 512,512"/>
  <polygon fill="url(#bladeGrad)" points="334,352 512,248 512,512"/>

  <!-- Inner hex -->
  <polygon fill="none" stroke="#5EE7FF" stroke-width="6" opacity="0.45"
           points="512,248 690,352 690,560 512,664 334,560 334,352"/>

  <!-- Center void -->
  <circle cx="512" cy="512" r="130" fill="#05080F"/>
  <circle cx="512" cy="512" r="130" fill="none" stroke="#5EE7FF" stroke-width="4" opacity="0.55"/>

  <!-- R monogram (shape-only, crisp at small size) -->
  <g fill="#F4FCFF">
    <rect x="448" y="420" width="32" height="184" rx="4"/>
    <path d="M480 420 H548 C598 420 632 450 632 498 C632 540 604 568 556 568 H480 V420 Z M512 448 H544 C572 448 592 464 592 496 C592 526 574 540 544 540 H512 V448 Z"/>
    <polygon points="508 568 592 620 560 644 476 592"/>
  </g>

  <!-- Vertex dots -->
  <g fill="#5EE7FF">
    <circle cx="512" cy="148" r="8"/>
    <circle cx="780" cy="302" r="8"/>
    <circle cx="780" cy="610" r="8"/>
    <circle cx="512" cy="764" r="8"/>
    <circle cx="244" cy="610" r="8"/>
    <circle cx="244" cy="302" r="8"/>
  </g>
</svg>
